name: WolfkillerSMP
version: '1.0.0'
main: com.wolfkiller.smp.WolfkillerSMP
api-version: '1.21'
depend: [Vault]
author: wolfkiller_smp
description: All-in-one custom plugin for wolfkiller_smp - sell system, custom enchants, kits, crates, bounty, and more.

commands:
  sell:
    description: Opens the sell GUI
    usage: /sell
  sellhand:
    description: Sells the item in your hand
    usage: /sellhand
  home:
    description: Opens the homes GUI, or teleports to a named home
    usage: /home [name]
  sethome:
    description: Sets a named home at your current location
    usage: /sethome <name>
  delhome:
    description: Deletes a named home
    usage: /delhome <name>
  shop:
    description: Opens the main shop GUI
    usage: /shop
  sellgui:
    description: Opens a box - drop items in it and close to sell them all
    usage: /sellgui
